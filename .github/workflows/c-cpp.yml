name: Build FakeDreamer Kernel

on:
  push:
    branches: [ stable ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          flex \
          bison \
          libssl-dev \
          bc \
          wget \
          unzip \
          git \
          gcc-aarch64-linux-gnu

    - name: Download Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git /opt/proton-clang

    - name: Build kernel
      run: |
        export ARCH=arm64
        export PATH="/opt/proton-clang/bin:$PATH"
        # CROSS_COMPILE указываем СИСТЕМНЫЙ aarch64-linux-gnu- (он есть в gcc-aarch64-linux-gnu)
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        
        make vendor/apollo_defconfig
        
        # Собираем: CC=clang использует Proton Clang, а host-утилиты собираются системным GCC
        make -j$(nproc) \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            STRIP=llvm-strip \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf

    - name: Upload kernel image
      uses: actions/upload-artifact@v4
      with:
        name: FakeDreamer-kernel
        path: |
          arch/arm64/boot/Image
          arch/arm64/boot/Image.gz
          arch/arm64/boot/Image.gz-dtb
          arch/arm64/boot/dtbo.img
