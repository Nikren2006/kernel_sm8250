name: Build FakeDreamer Kernel

on:
  push:
    branches: [ stable ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          flex \
          bison \
          libssl-dev \
          bc \
          gcc-aarch64-linux-gnu \
          git

    - name: Download Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git /opt/proton-clang

    - name: Build kernel
      run: |
        export ARCH=arm64
        # НЕ добавляем Proton Clang в общий PATH, чтобы его ld не переопределил системный
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        
        make vendor/apollo_defconfig
        
        # Явно указываем полные пути ТОЛЬКО для кросс-компиляции ядра
        make -j$(nproc) \
            CC=/opt/proton-clang/bin/clang \
            LD=/opt/proton-clang/bin/ld.lld \
            AR=/opt/proton-clang/bin/llvm-ar \
            NM=/opt/proton-clang/bin/llvm-nm \
            STRIP=/opt/proton-clang/bin/llvm-strip \
            OBJCOPY=/opt/proton-clang/bin/llvm-objcopy \
            OBJDUMP=/opt/proton-clang/bin/llvm-objdump \
            READELF=/opt/proton-clang/bin/llvm-readelf \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            HOSTLD=ld

    - name: Upload kernel image
      uses: actions/upload-artifact@v4
      with:
        name: FakeDreamer-kernel
        path: |
          arch/arm64/boot/Image
          arch/arm64/boot/Image.gz
          arch/arm64/boot/Image.gz-dtb
          arch/arm64/boot/dtbo.img
