name: Build FakeDreamer Kernel

on:
  push:
    branches: [ stable ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          flex \
          bison \
          libssl-dev \
          bc \
          gcc-aarch64-linux-gnu \
          git \
          wget

    - name: Download AOSP Clang
      run: |
        # Качаем официальный бинарный пакет Clang от Google
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
        mkdir -p /opt/aosp-clang
        tar -xzf clang-r522817.tar.gz -C /opt/aosp-clang/

    - name: Build kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        
        make vendor/apollo_defconfig
        
        make -j$(nproc) \
            CC=/opt/aosp-clang/bin/clang \
            LD=/opt/aosp-clang/bin/ld.lld \
            AR=/opt/aosp-clang/bin/llvm-ar \
            NM=/opt/aosp-clang/bin/llvm-nm \
            STRIP=/opt/aosp-clang/bin/llvm-strip \
            OBJCOPY=/opt/aosp-clang/bin/llvm-objcopy \
            OBJDUMP=/opt/aosp-clang/bin/llvm-objdump \
            READELF=/opt/aosp-clang/bin/llvm-readelf \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            HOSTLD=ld

    - name: Upload kernel image
      uses: actions/upload-artifact@v4
      with:
        name: FakeDreamer-kernel
        path: |
          arch/arm64/boot/Image
          arch/arm64/boot/Image.gz
          arch/arm64/boot/Image.gz-dtb
          arch/arm64/boot/dtbo.img
