name: Build FakeDreamer Kernel

on:
  push:
    branches: [ stable ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          flex \
          bison \
          libssl-dev \
          bc \
          gcc-aarch64-linux-gnu \
          git \
          wget

    - name: Cache AOSP Clang
      id: cache-clang
      uses: actions/cache@v4
      with:
        path: /opt/aosp-clang
        key: aosp-clang-r547379-v1

    - name: Download AOSP Clang
      if: steps.cache-clang.outputs.cache-hit != 'true'
      run: |
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz
        mkdir -p /opt/aosp-clang
        tar -xzf clang-r547379.tar.gz -C /opt/aosp-clang/

    - name: Build kernel
      run: |
        export ARCH=arm64
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export PATH="/opt/aosp-clang/bin:$PATH"
        
        make vendor/apollo_defconfig
        
        scripts/config --disable CONFIG_SPECTRA_CAMERA
        make olddefconfig
        
        make -j$(nproc) \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            STRIP=llvm-strip \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            HOSTLD=ld \
            KCFLAGS="-Wno-error" \
            KAFLAGS="-Wno-error"

    - name: Upload kernel image
      uses: actions/upload-artifact@v4
      with:
        name: FakeDreamer-kernel
        path: |
          arch/arm64/boot/Image
          arch/arm64/boot/Image.gz
          arch/arm64/boot/Image.gz-dtb
          arch/arm64/boot/dtbo.img
